<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickleball Maniacs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container header-content">

            <div class="brand">
                <img src="PM-No-BG-Logo.png" alt="Pickleball Maniacs Logo">

                <div>
                    <h1>Pickleball Maniacs</h1>
                    <p>Our games, courts, and community.</p>
                </div>

            </div>

        </div>
    </header>


    <main class="container">

        <section class="hero">
            <h2>Upcoming Games</h2>
            <p>See where and when we're playing.</p>
        </section>


        <!-- Games will be loaded from Google Sheets -->

        <section class="games" id="games">
            <p>Loading upcoming games...</p>
        </section>

    </main>


    <footer>

        <p>🏓 Pickleball Maniacs</p>
        <p>Community games • Courts • Players</p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
